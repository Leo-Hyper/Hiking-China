name: Backup Turso

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hiking-new/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hiking-new/server/package-lock.json
      - run: npm ci
      - run: npm run backup:turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BACKUP_DIR: ${{ runner.temp }}/turso-backup
      - uses: actions/upload-artifact@v4
        with:
          name: turso-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/turso-backup
          retention-days: 3
