[build]
  base = "hiking-new/frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE_URL = ""
  CLIENT_BASE_PATH = ""

# API proxy must precede the SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "https://hiking-china-api-t250.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/uploads/*"
  to = "https://hiking-china-api-t250.onrender.com/uploads/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
